# =============================================================================
# Aitzaz AI — full local development stack
#   docker compose up --build
#   Web:  http://localhost:3000   (register or use demo@aitzaz.ai / demo-user-2026)
#   API:  http://localhost:8000   (docs at /docs, health at /api/health)
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aitzaz
      POSTGRES_PASSWORD: aitzaz
      POSTGRES_DB: aitzaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitzaz -d aitzaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AITZAZ_ENVIRONMENT: development
      AITZAZ_SECRET_KEY: ${AITZAZ_SECRET_KEY:-change-me-in-production-please-generate-a-real-key}
      AITZAZ_DATABASE_URL: postgresql+psycopg2://aitzaz:aitzaz@db:5432/aitzaz
      AITZAZ_REDIS_URL: redis://redis:6379/0
      AITZAZ_LLM_PROVIDER: ${AITZAZ_LLM_PROVIDER:-mock}
      AITZAZ_OPENAI_API_KEY: ${AITZAZ_OPENAI_API_KEY:-}
      AITZAZ_ANTHROPIC_API_KEY: ${AITZAZ_ANTHROPIC_API_KEY:-}
      AITZAZ_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      AITZAZ_SEED_DEMO_USER: "true"
      AITZAZ_DEMO_USER_EMAIL: demo@aitzaz.ai
      AITZAZ_DEMO_USER_PASSWORD: demo-user-2026
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_ORIGIN: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_ORIGIN: http://api:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
