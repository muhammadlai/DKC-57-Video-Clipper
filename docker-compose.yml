services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: aitzazai/backend:latest
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10240}
      TMP_DIR: ${TMP_DIR:-/data/tmp}
      DB_PATH: ${DB_PATH:-/data/openclip.db}
      D57_API_KEY: ${D57_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_UNLOCK_CODE: ${ADMIN_UNLOCK_CODE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      STUMPS_TEAM_ID: ${STUMPS_TEAM_ID:--OiyGifAxdcSXcSbbE5m}
      ROLLING_SEGMENT_SECONDS: ${ROLLING_SEGMENT_SECONDS:-5}
      ROLLING_RETAIN_SECONDS: ${ROLLING_RETAIN_SECONDS:-180}
      PRODUCTION_POLL_SECONDS: ${PRODUCTION_POLL_SECONDS:-8}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: aitzazai/frontend:latest
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
