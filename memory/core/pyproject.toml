[project]
name = "aitzaz-memory-core"
version = "0.1.0"
description = "Memory abstraction for Aitzaz AI"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aitzaz_memory*"]
