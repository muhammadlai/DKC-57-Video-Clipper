[project]
name = "aitzaz-agents-core"
version = "0.1.0"
description = "Agent core abstraction and LLM provider interface for Aitzaz AI"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aitzaz_agents*"]
